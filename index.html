<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="description" content="PIXEL FOOD AI ผู้ช่วยสุ่มเมนูอาหารประจำวัน">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>PIXEL FOOD AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap');

:root{
  --bg:#0b101b;
  --panel:#141d2c;
  --panel2:#192438;
  --line:rgba(205,190,150,.22);
  --gold:#c9a96e;
  --gold2:#f0d6a0;
  --text:#f3eee4;
  --muted:#9ba8b9;
  --green:#58b99a;
  --red:#b96c75;
  --shadow:0 18px 45px rgba(0,0,0,.38);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:'Kanit',sans-serif;
  background:
    radial-gradient(ellipse at 50% -15%,rgba(76,105,143,.25),transparent 48%),
    radial-gradient(ellipse at 90% 80%,rgba(123,76,86,.12),transparent 40%),
    var(--bg);
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.16;
  background-image:
    radial-gradient(1px 1px at 20% 30%,#fff 99%,transparent),
    radial-gradient(1px 1px at 70% 60%,#fff 99%,transparent),
    radial-gradient(2px 2px at 40% 80%,#d9c18f 99%,transparent),
    radial-gradient(1px 1px at 85% 15%,#fff 99%,transparent);
  background-size:180px 180px,240px 240px,300px 300px,220px 220px;
  z-index:-1;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.app{
  width:min(100%,650px);
  margin:auto;
  padding:24px 18px 50px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:5px 2px 20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-mark{
  width:43px;
  height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:22px;
  color:var(--gold2);
  background:linear-gradient(145deg,#29364a,#101827);
  border:1px solid rgba(220,192,137,.4);
  box-shadow:inset 0 1px 1px #ffffff20,0 7px 18px #0008;
}

.brand-name{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;
  letter-spacing:2px;
  line-height:1.1;
}

.brand-sub{
  font-size:10px;
  color:var(--muted);
  letter-spacing:2px;
  margin-top:3px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:13px;
  color:var(--gold2);
  background:linear-gradient(145deg,#263348,#141d2b);
  border:1px solid var(--line);
  box-shadow:0 5px 12px #0006,inset 0 1px 1px #ffffff18;
  font-size:17px;
}

.icon-btn:active,.action-btn:active,.main-btn:active{
  transform:translateY(2px);
  box-shadow:inset 0 3px 8px #0007;
}

.hero{
  position:relative;
  text-align:center;
  padding:14px 8px 8px;
}

.eyebrow{
  color:var(--gold);
  font-family:'Cormorant Garamond',serif;
  font-size:13px;
  letter-spacing:4px;
  text-transform:uppercase;
}

.hero h1{
  margin:5px 0 2px;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(32px,8vw,43px);
  font-weight:600;
  letter-spacing:2px;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:12px;
}

.mascot-stage{
  height:190px;
  margin:8px auto 2px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.mascot-glow{
  position:absolute;
  width:190px;
  height:145px;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(109,91,139,.28),transparent 70%);
  filter:blur(8px);
}

.mascot{
  position:relative;
  width:170px;
  height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  filter:drop-shadow(0 12px 16px #0008);
  animation:float 5s ease-in-out infinite;
}

.mascot svg{width:100%;height:100%;overflow:visible}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

.companion{
  position:absolute;
  width:65px;
  height:65px;
  right:calc(50% - 112px);
  bottom:22px;
  filter:drop-shadow(0 8px 9px #0009);
  animation:float 4s ease-in-out infinite reverse;
}

.companion svg{width:100%;height:100%}

.card{
  position:relative;
  margin-top:12px;
  padding:22px 18px;
  border:1px solid var(--line);
  border-radius:23px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.035),transparent 45%),
    linear-gradient(145deg,#1b293d,#111a29 75%);
  box-shadow:var(--shadow),inset 0 1px 1px #ffffff10;
  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border:1px solid rgba(201,169,110,.08);
  border-radius:50%;
  right:-110px;
  top:-100px;
  box-shadow:0 0 0 18px rgba(201,169,110,.025),0 0 0 38px rgba(201,169,110,.018);
  pointer-events:none;
}

.card-label{
  color:var(--gold);
  font-size:11px;
  letter-spacing:2px;
  text-align:center;
}

.dish-display{
  min-height:155px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:17px 5px 12px;
}

.dish-emoji{
  font-size:43px;
  margin-bottom:8px;
  filter:drop-shadow(0 5px 8px #0007);
}

.dish-name{
  font-size:25px;
  font-weight:600;
  line-height:1.35;
}

.dish-desc{
  color:var(--muted);
  font-size:12px;
  margin-top:7px;
  line-height:1.7;
  max-width:430px;
}

.dish-meta{
  display:flex;
  gap:7px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:12px;
}

.tag{
  border:1px solid rgba(201,169,110,.25);
  background:rgba(201,169,110,.08);
  color:#e5cca0;
  border-radius:30px;
  padding:4px 11px;
  font-size:10px;
}

.empty-dish{
  color:var(--muted);
  font-size:13px;
}

.main-btn{
  width:100%;
  min-height:57px;
  border:1px solid #e5c98f88;
  border-radius:16px;
  color:#241b11;
  font-size:16px;
  font-weight:600;
  letter-spacing:.5px;
  background:linear-gradient(145deg,#f0d7a6,#c49b5c 60%,#a77c43);
  box-shadow:0 7px 0 #72542f,0 12px 22px #0005,inset 0 2px 2px #fff8;
  transition:.15s;
}

.main-btn:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #72542f,0 5px 12px #0005;
}

.main-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  filter:grayscale(.6);
}

.secondary-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.action-btn{
  min-height:45px;
  border:1px solid var(--line);
  border-radius:13px;
  color:var(--text);
  background:linear-gradient(145deg,#28364b,#172235);
  box-shadow:0 5px 12px #0005,inset 0 1px 1px #ffffff14;
  font-size:12px;
  transition:.15s;
}

.action-btn.gold{
  color:var(--gold2);
  border-color:#c9a96e55;
}

.action-btn.green{
  color:#a9e6d0;
  border-color:#58b99a55;
}

.action-btn.red{
  color:#e4a6aa;
  border-color:#b96c7555;
}

.filter-area{
  margin-top:20px;
}

.section-heading{
  font-size:12px;
  color:var(--muted);
  margin-bottom:9px;
  letter-spacing:.5px;
}

.pills{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.pill{
  padding:8px 14px;
  border-radius:30px;
  border:1px solid var(--line);
  color:#c0c9d5;
  background:#151f30;
  font-size:11px;
}

.pill.active{
  color:var(--gold2);
  border-color:#c9a96e88;
  background:linear-gradient(145deg,#403b32,#252b35);
  box-shadow:inset 0 1px 1px #ffffff14,0 3px 9px #0004;
}

.status-line{
  margin-top:17px;
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:var(--muted);
  font-size:11px;
  text-align:center;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 9px var(--green);
}

.status-line button{
  color:var(--gold2);
  border:0;
  background:none;
  text-decoration:underline;
  font-size:11px;
  padding:3px;
}

.utility-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:20px;
}

.utility{
  padding:13px 5px;
  border-radius:15px;
  background:linear-gradient(145deg,#202e43,#131e2e);
  border:1px solid var(--line);
  color:var(--text);
  text-align:center;
  box-shadow:0 5px 12px #0004,inset 0 1px 1px #ffffff10;
  font-size:11px;
}

.utility span{
  display:block;
  font-size:21px;
  margin-bottom:5px;
}

.footer{
  text-align:center;
  color:#657286;
  font-family:'Cormorant Garamond',serif;
  font-size:12px;
  letter-spacing:2px;
  margin-top:32px;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:14px;
  background:rgba(3,7,14,.76);
  backdrop-filter:blur(8px);
}

.modal-backdrop.show{display:flex}

.modal{
  width:min(100%,560px);
  max-height:85vh;
  overflow:auto;
  padding:22px;
  border-radius:23px;
  border:1px solid var(--line);
  background:linear-gradient(145deg,#202d42,#101927);
  box-shadow:0 20px 60px #000b;
  animation:rise .2s ease-out;
}

@keyframes rise{
  from{transform:translateY(20px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.modal-title{
  font-size:18px;
  font-weight:600;
}

.close-btn{
  width:34px;
  height:34px;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--text);
  background:#ffffff0b;
}

.field{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0d1725;
  color:var(--text);
  outline:none;
  margin:8px 0;
  font-size:13px;
}

.field:focus{border-color:var(--gold)}

.ingredient-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:12px 0;
}

.ingredient{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:30px;
  background:#ffffff08;
  color:#d9e0e8;
  font-size:11px;
}

.recipe-list{
  padding-left:22px;
  color:#cbd4df;
  font-size:13px;
  line-height:2;
}

.recipe-title{
  font-weight:600;
  color:var(--gold2);
  margin:15px 0 5px;
}

.favorite-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.favorite-item button{
  border:0;
  background:none;
  color:#e39ba4;
  font-size:17px;
}

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.setting-row input[type=range]{width:120px;accent-color:var(--gold)}

.switch{
  width:43px;
  height:24px;
  appearance:none;
  background:#394456;
  border-radius:20px;
  position:relative;
  cursor:pointer;
  transition:.2s;
}

.switch:before{
  content:"";
  width:18px;
  height:18px;
  position:absolute;
  top:3px;
  left:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}

.switch:checked{background:#5baf91}
.switch:checked:before{left:22px}

.toast{
  position:fixed;
  z-index:80;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:11px 18px;
  border:1px solid var(--line);
  border-radius:30px;
  background:#202d40;
  color:var(--text);
  box-shadow:0 8px 25px #0008;
  font-size:12px;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(min-width:600px){
  .app{padding-top:30px}
  .modal-backdrop{align-items:center}
}

@media(max-width:370px){
  .app{padding-left:12px;padding-right:12px}
  .card{padding:18px 13px}
  .dish-name{font-size:22px}
  .utility-grid{gap:6px}
}
</style>
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div>
        <div class="brand-name">PIXEL FOOD AI</div>
        <div class="brand-sub">YOUR DAILY FOOD COMPANION</div>
      </div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="ตั้งค่า">⚙</button>
  </header>

  <section class="hero">
    <div class="eyebrow">A LITTLE MAGIC EVERYDAY</div>
    <h1>วันนี้กินอะไรดี?</h1>
    <p>ให้ซิลทิสช่วยค้นพบมื้ออาหารของคุณ</p>

    <div class="mascot-stage">
      <div class="mascot-glow"></div>
      <div class="mascot">
        <!-- ภาพตกแต่งตัวละครชั่วคราวในตัวไฟล์ -->
        <svg viewBox="0 0 180 180" role="img" aria-label="ตัวละครนักสำรวจ">
          <defs>
            <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#e3e1e7"/>
              <stop offset=".45" stop-color="#858b9e"/>
              <stop offset="1" stop-color="#3a4357"/>
            </linearGradient>
            <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#fff"/>
              <stop offset=".55" stop-color="#bfc5d2"/>
              <stop offset="1" stop-color="#737e91"/>
            </linearGradient>
            <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#d8a77e"/>
              <stop offset="1" stop-color="#9b654d"/>
            </linearGradient>
          </defs>
          <ellipse cx="90" cy="164" rx="49" ry="8" fill="#000" opacity=".3"/>
          <path d="M48 164 Q49 120 68 110 L112 110 Q135 123 137 164Z" fill="url(#coat)" stroke="#c6b58d" stroke-width="1.5"/>
          <path d="M74 113 L90 145 L106 113 L99 164 L81 164Z" fill="#202b40"/>
          <path d="M80 114 L90 132 L100 114" fill="none" stroke="#d8c08f" stroke-width="2"/>
          <path d="M59 130 L39 157 L48 163 L72 139" fill="url(#coat)" stroke="#b9b6b2"/>
          <path d="M119 130 L140 155 L132 163 L108 140" fill="url(#coat)" stroke="#b9b6b2"/>
          <path d="M63 67 Q59 35 90 30 Q125 33 119 78 L113 109 Q91 127 67 105Z" fill="url(#skin)"/>
          <path d="M60 72 Q45 25 90 18 Q132 19 123 76 Q116 53 101 45 Q86 57 61 58Z" fill="url(#hair)"/>
          <path d="M65 57 Q43 83 62 111 Q72 120 78 113 L73 78Z" fill="url(#hair)"/>
          <path d="M112 49 Q135 73 116 111 Q109 117 104 110 L109 74Z" fill="url(#hair)"/>
          <path d="M79 78 Q84 72 89 78" stroke="#482c2b" stroke-width="2" fill="none"/>
          <path d="M98 78 Q104 72 109 78" stroke="#482c2b" stroke-width="2" fill="none"/>
          <ellipse cx="84" cy="84" rx="4" ry="5" fill="#7f273a"/>
          <ellipse cx="104" cy="84" rx="4" ry="5" fill="#7f273a"/>
          <circle cx="85" cy="83" r="1.4" fill="#fff"/>
          <circle cx="105" cy="83" r="1.4" fill="#fff"/>
          <path d="M89 99 Q96 104 102 98" stroke="#70433d" stroke-width="1.5" fill="none"/>
          <path d="M118 38 Q137 46 145 29 Q141 54 119 60" fill="url(#hair)"/>
          <path d="M70 112 L90 124 L110 112" fill="none" stroke="#d8c08f" stroke-width="2"/>
          <circle cx="90" cy="137" r="3" fill="#d8c08f"/>
          <path d="M51 153 L37 162 M129 153 L143 162" stroke="#c9a96e" stroke-width="2"/>
        </svg>
      </div>

      <div class="companion">
        <svg viewBox="0 0 100 100" role="img" aria-label="งูดำ Black">
          <defs>
            <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#566071"/>
              <stop offset=".5" stop-color="#171e2c"/>
              <stop offset="1" stop-color="#05080e"/>
            </linearGradient>
          </defs>
          <path d="M18 79 Q5 56 25 44 Q45 33 60 52 Q74 70 53 76 Q35 81 36 62 Q38 49 57 42 Q77 34 79 17" fill="none" stroke="url(#snake)" stroke-width="16" stroke-linecap="round"/>
          <path d="M18 79 Q5 56 25 44 Q45 33 60 52 Q74 70 53 76" fill="none" stroke="#a4aaba" stroke-opacity=".25" stroke-width="2"/>
          <path d="M71 19 Q75 6 91 11 Q98 22 85 31 L74 27Z" fill="#111827" stroke="#596274" stroke-width="1.5"/>
          <circle cx="85" cy="17" r="2.5" fill="#d64c5d"/>
          <circle cx="85.5" cy="16.5" r=".8" fill="#fff"/>
          <path d="M88 26 L95 29" stroke="#d64c5d" stroke-width="1.5"/>
        </svg>
      </div>
    </div>
  </section>

  <main>
    <section class="card">
      <div class="card-label">✦ THE DAILY DISCOVERY ✦</div>

      <div class="dish-display" id="dishDisplay">
        <div class="empty-dish">พร้อมแล้วหรือยัง? กดสุ่มเพื่อค้นพบมื้ออาหาร</div>
      </div>

      <button class="main-btn" id="randomBtn">✧ สุ่มเมนูอาหาร ✧</button>

      <div class="secondary-row">
        <button class="action-btn green" id="confirmBtn" disabled>✓ อันนี้แหละ!</button>
        <button class="action-btn" id="recipeBtn" disabled>♨ ดูวิธีทำ</button>
      </div>

      <div class="secondary-row">
        <button class="action-btn gold" id="favoriteBtn" disabled>♡ เพิ่มเมนูโปรด</button>
        <button class="action-btn red" id="rerollBtn" disabled>↻ สุ่มใหม่</button>
      </div>

      <div class="status-line" id="statusLine">
        <span class="status-dot"></span>
        <span>เลือกเมนูที่ถูกใจ แล้วกดยืนยันได้เลย</span>
      </div>
    </section>

    <section class="filter-area">
      <div class="section-heading">เลือกประเภทเมนู</div>
      <div class="pills" id="typeFilters">
        <button class="pill active" data-type="all">ทั้งหมด</button>
        <button class="pill" data-type="rice">🍚 เมนูข้าว</button>
        <button class="pill" data-type="noodle">🍜 เมนูเส้น</button>
      </div>
    </section>

    <section class="filter-area">
      <div class="section-heading">รูปแบบการสุ่ม</div>
      <div class="pills" id="modeFilters">
        <button class="pill active" data-mode="normal">ปกติ</button>
        <button class="pill" data-mode="budget">ประหยัด</button>
        <button class="pill" data-mode="world">นานาชาติ</button>
      </div>
    </section>

    <section class="utility-grid">
      <button class="utility" id="fridgeBtn"><span>🧊</span>วัตถุดิบในตู้เย็น</button>
      <button class="utility" id="favoritesBtn"><span>♡</span>เมนูโปรด</button>
      <button class="utility" id="soundBtn"><span>♫</span>เสียงประกอบ</button>
    </section>
  </main>

  <footer class="footer">EXPLORE · TASTE · ENJOY</footer>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="close-btn" id="closeModal">✕</button>
    </div>
    <div id="modalBody"></div>

/* ==========================================
   APP STATE
========================================== */

const $ = id => document.getElementById(id);

const STORAGE = {
 daily:"pfa-daily-v2",
 favs:"pfa-favs",
 sound:"pfa-sound",
 volume:"pfa-volume",
 fridge:"pfa-fridge"
};

let currentType = "all";
let currentMode = "normal";
let currentDish = null;
let isFridgeMode = false;
let isSpinning = false;
let fridgeIngredients = [];
let soundEnabled = localStorage.getItem(STORAGE.sound) !== "false";
let volume = Number(localStorage.getItem(STORAGE.volume) || 0.35);
let audioContext = null;
let dailyData = null;

/* ==========================================
   THAI DATE / DAILY STORAGE
========================================== */

function thaiDateKey(){
  const parts = new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Bangkok",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).formatToParts(new Date());

  const get = type => parts.find(p => p.type === type).value;
  return `${get("year")}-${get("month")}-${get("day")}`;
}

function loadDailyData(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE.daily) || "null");

    if(saved && saved.date === thaiDateKey()){
      return {
        date:saved.date,
        meals:Array.isArray(saved.meals) ? saved.meals : [],
        pending:saved.pending || null
      };
    }
  }catch(e){}

  return {
    date:thaiDateKey(),
    meals:[],
    pending:null
  };
}

function saveDaily(){
  dailyData.date = thaiDateKey();
  localStorage.setItem(STORAGE.daily,JSON.stringify(dailyData));
}

function checkNewDay(){
  const today = thaiDateKey();

  if(!dailyData || dailyData.date !== today){
    dailyData = {
      date:today,
      meals:[],
      pending:null
    };
    saveDaily();
    currentDish = null;
    renderEmpty();
    updateStatus("วันใหม่แล้ว พร้อมค้นพบเมนูใหม่!");
    return true;
  }
  return false;
}

dailyData = loadDailyData();

/* ==========================================
   FAVORITES
========================================== */

function getFavorites(){
  try{
    const value = JSON.parse(localStorage.getItem(STORAGE.favs) || "[]");
    return Array.isArray(value) ? value : [];
  }catch(e){
    return [];
  }
}

function saveFavorites(list){
  localStorage.setItem(STORAGE.favs,JSON.stringify(list));
}

function isFavorite(name){
  return getFavorites().includes(name);
}

function toggleFavorite(){
  if(!currentDish) return;

  let favs = getFavorites();

  if(favs.includes(currentDish.name)){
    favs = favs.filter(n => n !== currentDish.name);
    toast("นำออกจากเมนูโปรดแล้ว");
  }else{
    favs.push(currentDish.name);
    toast("เพิ่มเมนูโปรดแล้ว ♡");
  }

  saveFavorites(favs);
  updateFavoriteButton();
}

/* ==========================================
   SOUND
========================================== */

function playSound(freq=520,duration=.09){
  if(!soundEnabled) return;

  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;

    if(!audioContext) audioContext = new AudioCtx();
    if(audioContext.state === "suspended") audioContext.resume();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(freq,audioContext.currentTime);

    gain.gain.setValueAtTime(volume * .12,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime + duration);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
  }catch(e){}
}

function clickSound(){
  playSound(600,.06);
}

function toggleSound(){
  soundEnabled = !soundEnabled;
  localStorage.setItem(STORAGE.sound,String(soundEnabled));
  updateSoundButton();
  if(soundEnabled) playSound(720,.12);
  toast(soundEnabled ? "เปิดเสียงแล้ว" : "ปิดเสียงแล้ว");
}

function updateSoundButton(){
  $("soundBtn").innerHTML = `<span>${soundEnabled ? "♫" : "🔇"}</span>${soundEnabled ? "ปิดเสียง" : "เปิดเสียง"}`;
}

/* ==========================================
   FILTERING AND FOOD POOL
========================================== */

function getBasePool(){
  let pool = foods.filter(food => {
    return currentType === "all" || food.type === currentType;
  });

  if(currentMode === "budget"){
    pool = pool.filter(food => food.budget <= 1);
  }

  if(currentMode === "world"){
    pool = pool.filter(food => food.world);
  }

  if(isFridgeMode){
    pool = pool.filter(food => {
      return fridgeIngredients.some(item =>
        food.items.some(ingredient =>
          ingredient.toLowerCase().includes(item.toLowerCase()) ||
          item.toLowerCase().includes(ingredient.toLowerCase())
        )
      );
    });
  }

  return pool;
}

/* ==========================================
   VARIETY SCORING
========================================== */

function getFoodGroup(food){
  return food.group || food.type;
}

function scoreFood(food){
  const meals = dailyData.meals;
  let score = 10;

  if(meals.length === 0) return score;

  const last = meals[meals.length - 1];

  // ลดคะแนนเมนูประเภทเดียวกับมื้อล่าสุด
  if(last.type === food.type) score -= 1.5;

  // ลดคะแนนกลุ่มอาหารเดิม
  if(last.group === getFoodGroup(food)) score -= 5;

  // ลดคะแนนวัตถุดิบหลักที่ซ้ำกัน
  const overlap = food.items.filter(item =>
    last.items && last.items.includes(item)
  ).length;

  score -= overlap * 1.3;

  // ลดคะแนนเมนูที่ยืนยันไปแล้วในวันเดียวกัน
  if(meals.some(meal => meal.name === food.name)){
    score -= 100;
  }

  // เพิ่มคะแนนกลุ่มที่ยังไม่ค่อยได้กิน
  const sameGroupCount = meals.filter(m => m.group === getFoodGroup(food)).length;
  score -= sameGroupCount * 2;

  return score;
}

function weightedPick(pool){
  if(!pool.length) return null;

  const scores = pool.map(food => ({
    food,
    weight:Math.max(0.5,scoreFood(food) + 6)
  }));

  const total = scores.reduce((sum,item) => sum + item.weight,0);
  let random = Math.random() * total;

  for(const item of scores){
    random -= item.weight;
    if(random <= 0) return item.food;
  }

  return scores[scores.length - 1].food;
}

function pickRandomFood(){
  let pool = getBasePool();

  if(!pool.length){
    return null;
  }

  const notEaten = pool.filter(food =>
    !dailyData.meals.some(meal => meal.name === food.name)
  );

  if(notEaten.length){
    pool = notEaten;
  }

  return weightedPick(pool);
}

/* ==========================================
   RENDER FOOD
========================================== */

function renderEmpty(){
  $("dishDisplay").innerHTML = `
    <div class="empty-dish">
      พร้อมแล้วหรือยัง? กดสุ่มเพื่อค้นพบมื้ออาหาร
    </div>
  `;

  currentDish = null;
  updateButtons();
}

function renderDish(food){
  if(!food){
    $("dishDisplay").innerHTML = `
      <div class="empty-dish">
        ไม่พบเมนูที่ตรงกับเงื่อนไขนี้<br>
        ลองเปลี่ยนตัวกรองหรือวัตถุดิบดูนะ
      </div>
    `;
    currentDish = null;
    updateButtons();
    return;
  }

  currentDish = food;
  dailyData.pending = food.name;
  saveDaily();

  $("dishDisplay").innerHTML = `
    <div class="dish-emoji">${food.emoji}</div>
    <div class="dish-name">${escapeHTML(food.name)}</div>
    <div class="dish-desc">${escapeHTML(food.desc)}</div>
    <div class="dish-meta">
      <span class="tag">${food.type === "rice" ? "เมนูข้าว" : "เมนูเส้น"}</span>
      <span class="tag">${escapeHTML(food.origin)}</span>
      <span class="tag">${food.budget === 1 ? "ประหยัด" : food.budget === 2 ? "ระดับกลาง" : "วัตถุดิบพิเศษ"}</span>
    </div>
  `;

  updateButtons();
  updateStatus("ได้เมนูแล้ว! ถูกใจเมนูนี้กดยืนยันได้เลย");
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

/* ==========================================
   RANDOM BUTTON
========================================== */

function random(){
  if(isSpinning) return;

  checkNewDay();

  if(dailyData.meals.length >= 5){
    toast("วันนี้ยืนยันครบ 5 มื้อแล้ว");
    return;
  }

  isSpinning = true;
  $("randomBtn").disabled = true;
  $("randomBtn").textContent = "✧ กำลังค้นหาเมนู ✧";

  playSound(420,.07);

  const pool = getBasePool();

  if(!pool.length){
    isSpinning = false;
    $("randomBtn").disabled = false;
    $("randomBtn").textContent = "✧ สุ่มเมนูอาหาร ✧";
    toast("ไม่พบเมนูที่ตรงกับเงื่อนไข");
    return;
  }

  let count = 0;
  const duration = 900;

  const timer = setInterval(() => {
    const preview = pool[Math.floor(Math.random() * pool.length)];
    $("dishDisplay").innerHTML = `
      <div class="dish-emoji">${preview.emoji}</div>
      <div class="dish-name">${escapeHTML(preview.name)}</div>
      <div class="dish-desc">กำลังค้นพบเมนูที่เหมาะกับคุณ...</div>
    `;

    playSound(300 + Math.random()*300,.035);
    count += 1;

    if(count >= 9){
      clearInterval(timer);
      const selected = pickRandomFood();
      renderDish(selected);

      isSpinning = false;
      $("randomBtn").disabled = false;
      $("randomBtn").textContent = "✧ สุ่มเมนูอาหาร ✧";
      playSound(760,.13);
    }
  },duration/9);
}

/* ==========================================
   CONFIRM / UNDO MEAL
========================================== */

function confirmMeal(){
  if(!currentDish || isSpinning) return;

  checkNewDay();

  if(dailyData.meals.length >= 5){
    toast("วันนี้ครบ 5 มื้อแล้ว");
    return;
  }

  if(dailyData.meals.some(m => m.name === currentDish.name)){
    toast("เมนูนี้ถูกยืนยันไปแล้ววันนี้");
    return;
  }

  dailyData.meals.push({
    name:currentDish.name,
    type:currentDish.type,
    group:getFoodGroup(currentDish),
    items:[...currentDish.items],
    confirmedAt:Date.now()
  });

  dailyData.pending = null;
  saveDaily();

  currentDish = null;
  renderEmpty();

  updateStatus("ยืนยันมื้ออาหารแล้ว ✓");
  showUndoButton();
  toast("บันทึกมื้ออาหารเรียบร้อยแล้ว");
  playSound(850,.16);
}

function undoLastMeal(){
  if(!dailyData.meals.length) return;

  dailyData.meals.pop();
  saveDaily();

  updateStatus("ยกเลิกการยืนยันมื้อล่าสุดแล้ว");
  toast("ยกเลิกมื้ออาหารแล้ว");
  hideUndoButton();
}

function showUndoButton(){
  $("statusLine").innerHTML = `
    <span class="status-dot"></span>
    <span>บันทึกมื้ออาหารแล้ว</span>
    <button id="undoBtn">เลิกทำ</button>
  `;
  $("undoBtn").onclick = undoLastMeal;
}

function hideUndoButton(){
  updateStatus("เลือกเมนูที่ถูกใจ แล้วกดยืนยันได้เลย");
}

/* ==========================================
   STATUS AND BUTTONS
========================================== */

function updateStatus(message){
  $("statusLine").innerHTML = `
    <span class="status-dot"></span>
    <span>${escapeHTML(message)}</span>
  `;
}

function updateButtons(){
  const hasDish = !!currentDish;
  const canConfirm = dailyData.meals.length < 5;

  $("confirmBtn").disabled = !hasDish || !canConfirm;
  $("recipeBtn").disabled = !hasDish;
  $("favoriteBtn").disabled = !hasDish;
  $("rerollBtn").disabled = !hasDish || !canConfirm;
  $("randomBtn").disabled = isSpinning || !canConfirm;

  updateFavoriteButton();
}

function updateFavoriteButton(){
  if(!currentDish){
    $("favoriteBtn").textContent = "♡ เพิ่มเมนูโปรด";
    return;
  }

  $("favoriteBtn").textContent = isFavorite(currentDish.name)
    ? "♥ อยู่ในเมนูโปรดแล้ว"
    : "♡ เพิ่มเมนูโปรด";
}

  isFridgeMode = false;

});

$("modeFilters").addEventListener("click",event => {

  currentMode = button.dataset.mode;

  document.querySelectorAll("[data-mode]").forEach(el =>
    el.classList.toggle("active",el === button)
  );

  clickSound();
  isFridgeMode = false;
  renderEmpty();
  updateStatus("เปลี่ยนรูปแบบการสุ่มแล้ว");
});

/* ==========================================
   MODAL SYSTEM
========================================== */

function openModal(title,content){
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = content;
  $("modalBackdrop").classList.add("show");
}

function closeModal(){
  $("modalBackdrop").classList.remove("show");
}

$("closeModal").onclick = closeModal;

$("modalBackdrop").addEventListener("click",event=>{
  if(event.target === $("modalBackdrop")) closeModal();
});

/* ==========================================
   FRIDGE MODE
========================================== */

function openFridge(){
  const saved = JSON.parse(localStorage.getItem(STORAGE.fridge) || "[]");

  const ingredients = [
    "หมู","ไก่","เนื้อวัว","กุ้ง","ไข่","ไส้กรอก",
    "ข้าวสวย","เส้นใหญ่","วุ้นเส้น","เส้นสปาเกตตี",
    "บะหมี่","กะหล่ำปลี","ผักกาดขาว","แตงกวา",
    "มะเขือเทศ","แครอต","หอมหัวใหญ่","กระเทียม",
    "พริก","กะเพรา","ต้นหอม","ชีส","กิมจิ",
    "เต้าหู้","ปลา"
  ];

  openModal("🧊 วัตถุดิบในตู้เย็น",`
    <p style="font-size:12px;color:#9ba8b9">
      เลือกวัตถุดิบที่มีอยู่ แล้วระบบจะค้นหาเมนูที่ใช้วัตถุดิบเหล่านั้น
    </p>

    <div class="ingredient-list">
      ${ingredients.map(item=>`
        <label class="ingredient">
          <input type="checkbox" value="${escapeHTML(item)}"
            class="fridge-check" ${saved.includes(item) ? "checked" : ""}
            style="accent-color:#c9a96e">
          ${escapeHTML(item)}
        </label>
      `).join("")}
    </div>

    <button class="main-btn" id="applyFridge">ค้นหาเมนูจากวัตถุดิบ</button>
    <button class="action-btn" id="clearFridge" style="width:100%;margin-top:12px">
      ล้างรายการวัตถุดิบ
    </button>
  `);

  $("applyFridge").onclick = () => {
    fridgeIngredients = [...document.querySelectorAll(".fridge-check:checked")]
      .map(input=>input.value);

    localStorage.setItem(STORAGE.fridge,JSON.stringify(fridgeIngredients));

    if(!fridgeIngredients.length){
      toast("เลือกวัตถุดิบอย่างน้อย 1 อย่าง");
      return;
    }

    isFridgeMode = true;
    closeModal();
    renderEmpty();
    updateStatus("กำลังค้นหาเมนูจากวัตถุดิบของคุณ");
    toast("ตั้งค่าวัตถุดิบเรียบร้อย");
  };

  $("clearFridge").onclick = () => {
    fridgeIngredients = [];
    localStorage.removeItem(STORAGE.fridge);
    isFridgeMode = false;
    closeModal();
    renderEmpty();
    toast("ล้างวัตถุดิบแล้ว");
  };
}

/* ==========================================
   FAVORITES MODAL
========================================== */

function openFavorites(){
  const favs = getFavorites();

  const content = favs.length
    ? favs.map(name=>{
        const food = foods.find(f=>f.name === name);
        if(!food) return "";

        return `
          <div class="favorite-item">
            <span>${food.emoji} ${escapeHTML(food.name)}</span>
            <button data-remove-fav="${escapeHTML(food.name)}">♥</button>
          </div>
        `;
      }).join("")
    : `<p style="color:#9ba8b9;font-size:13px">ยังไม่มีเมนูโปรด ลองเพิ่มเมนูที่ชอบดูนะ</p>`;

  openModal("♡ เมนูโปรด",content);

  document.querySelectorAll("[data-remove-fav]").forEach(button=>{
    button.onclick = () => {
      const name = button.dataset.removeFav;
      saveFavorites(getFavorites().filter(item=>item !== name));
      openFavorites();
      toast("นำเมนูออกจากรายการโปรดแล้ว");
    };
  });
}

/* ==========================================
   SETTINGS
========================================== */

function openSettings(){
  openModal("ตั้งค่า",`
    <div class="setting-row">
      <span>เสียงประกอบ</span>
      <input type="checkbox" class="switch" id="soundSwitch" ${soundEnabled ? "checked" : ""}>
    </div>

    <div class="setting-row">
      <span>ระดับเสียง</span>
      <input type="range" min="0" max="1" step=".05" id="volumeRange" value="${volume}">
    </div>

    <div style="font-size:11px;color:#8795a7;line-height:1.8;margin-top:16px">
      ระบบจะบันทึกเมนูที่คุณยืนยันไว้ในอุปกรณ์นี้ และเริ่มวันใหม่ตามวันที่ประเทศไทยโดยอัตโนมัติ
    </div>
  `);

  $("soundSwitch").onchange = event=>{
    soundEnabled = event.target.checked;
    localStorage.setItem(STORAGE.sound,String(soundEnabled));
    updateSoundButton();
    if(soundEnabled) playSound(700,.1);
  };

  $("volumeRange").oninput = event=>{
    volume = Number(event.target.value);
    localStorage.setItem(STORAGE.volume,String(volume));
  };
}

/* ==========================================
   TOAST
========================================== */

let toastTimer;

function toast(message){
  const element = $("toast");
  element.textContent = message;
  element.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    element.classList.remove("show");
  },2200);
}

/* ==========================================
   PENDING RESTORE
========================================== */

function restorePending(){
  if(!dailyData.pending) return;

  const food = foods.find(item => item.name === dailyData.pending);

  if(food && !dailyData.meals.some(m=>m.name === food.name)){
    currentDish = food;

    $("dishDisplay").innerHTML = `
      <div class="dish-emoji">${food.emoji}</div>
      <div class="dish-name">${escapeHTML(food.name)}</div>
      <div class="dish-desc">${escapeHTML(food.desc)}</div>
      <div class="dish-meta">
        <span class="tag">${food.type === "rice" ? "เมนูข้าว" : "เมนูเส้น"}</span>
        <span class="tag">${escapeHTML(food.origin)}</span>
      </div>
    `;

    updateButtons();
    updateStatus("เมนูที่สุ่มไว้ยังรอการยืนยัน");
  }else{
    dailyData.pending = null;
    saveDaily();
  }
}

/* ==========================================
   EVENT LISTENERS
========================================== */

$("randomBtn").addEventListener("click",random);
$("rerollBtn").addEventListener("click",random);
$("confirmBtn").addEventListener("click",confirmMeal);
$("recipeBtn").addEventListener("click",openRecipe);
$("favoriteBtn").addEventListener("click",toggleFavorite);
$("fridgeBtn").addEventListener("click",openFridge);
$("favoritesBtn").addEventListener("click",openFavorites);
$("settingsBtn").addEventListener("click",openSettings);
$("soundBtn").addEventListener("click",toggleSound);

/* ==========================================
   REAL-DAY RESET CHECK
   Asia/Bangkok — no clock shown in UI
========================================== */

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden) checkNewDay();
});

window.addEventListener("focus",checkNewDay);

window.addEventListener("pageshow",checkNewDay);

// ตรวจวันจริงเป็นระยะ เผื่อเปิดหน้าแอปค้างไว้ข้ามวัน
setInterval(checkNewDay,60000);

/* ==========================================
   INITIALIZE
========================================== */

function initialize(){
  updateSoundButton();
  updateButtons();
  restorePending();

  if(!currentDish){
    renderEmpty();
  }

  if(dailyData.meals.length >= 5){
    updateStatus("วันนี้ยืนยันครบ 5 มื้อแล้ว");
  }
}

initialize();

/* ==========================================
   PWA SERVICE WORKER
========================================== */

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js")
      .catch(error=>{
        console.warn("Service Worker registration failed:",error);
      });
  });
}

</script>
